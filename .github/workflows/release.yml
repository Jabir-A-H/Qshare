name: Build & Release Desktop Binary

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-read from Cargo.toml, e.g. v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional, e.g. Qshare v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Resolve Version & Tag
        id: meta
        shell: pwsh
        run: |
          # Read version from Cargo.toml
          $cargoVersion = (Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          
          # Determine tag
          if ("${{ github.event.inputs.tag_name }}" -ne "") {
            $tag = "${{ github.event.inputs.tag_name }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$cargoVersion"
          }

          # Determine title
          if ("${{ github.event.inputs.release_title }}" -ne "") {
            $title = "${{ github.event.inputs.release_title }}"
          } else {
            $title = "Qshare $tag"
          }

          # Determine pre-production status (prerelease vs latest)
          if ($tag -match "-(alpha|beta|rc)" -or $tag -match "^v0\.") {
            $isPrerelease = "true"
            $makeLatest = "false"
          } else {
            $isPrerelease = "false"
            $makeLatest = "true"
          }

          Write-Output "Resolved Tag: $tag"
          Write-Output "Resolved Title: $title"
          Write-Output "Is Prerelease: $isPrerelease"
          Write-Output "Make Latest: $makeLatest"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT

      - name: Run Quality Verification Gates
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Build Standalone Release Executable
        run: cargo build --release --locked

      - name: Package Windows Binary and ZIP Archive
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $exeTarget = "target\release\qshare-$tag-windows-x64.exe"
          $zipName = "qshare-$tag-windows-x64.zip"
          $checksumFile = "target\release\checksums-$tag.txt"

          # Create matching named .exe
          Copy-Item -Path "target\release\qshare.exe" -Destination $exeTarget -Force
          Write-Output "Created $exeTarget"

          # Create matching compressed .zip archive
          Compress-Archive -Path $exeTarget -DestinationPath "target\release\$zipName" -Force
          Write-Output "Created target\release\$zipName"

          # Generate cryptographic SHA-256 checksums
          $exeHash = (Get-FileHash -Path $exeTarget -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash -Path "target\release\$zipName" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $(Split-Path $exeTarget -Leaf)" | Out-File -FilePath $checksumFile -Encoding utf8
          "$zipHash  $zipName" | Out-File -FilePath $checksumFile -Append -Encoding utf8
          Write-Output "Generated SHA-256 Checksums in $checksumFile"

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          body: |
            ### 📦 Available Downloads (Pre-Production Build)
            > **Note:** Both download options below contain the exact same application. Choose whichever packaging fits your preference:

            1. **`qshare-${{ steps.meta.outputs.tag }}-windows-x64.exe`**: Direct standalone executable. Ready to run immediately with zero unzipping required.
            2. **`qshare-${{ steps.meta.outputs.tag }}-windows-x64.zip`**: Compressed archive (~57% smaller download) containing the exact same `.exe` binary. Ideal if your browser or network restricts `.exe` downloads.
            3. **`checksums-${{ steps.meta.outputs.tag }}.txt`**: SHA-256 cryptographic verification hashes.
          files: |
            target/release/qshare-${{ steps.meta.outputs.tag }}-windows-x64.exe
            target/release/qshare-${{ steps.meta.outputs.tag }}-windows-x64.zip
            target/release/checksums-${{ steps.meta.outputs.tag }}.txt

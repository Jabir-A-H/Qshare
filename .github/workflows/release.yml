name: Unified Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-read from Cargo.toml, e.g. v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional, e.g. Qshare v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  resolve-meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compute Metadata
        id: meta
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$CARGO_VERSION"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="Qshare $TAG"
          fi

          if [[ "$TAG" =~ -(alpha|beta|rc) ]] || [[ "$TAG" =~ ^v0\. ]]; then
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            PRERELEASE="false"
            MAKE_LATEST="true"
          fi

          echo "Resolved Tag: $TAG"
          echo "Resolved Title: $TITLE"
          echo "Is Prerelease: $PRERELEASE"
          echo "Make Latest: $MAKE_LATEST"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "make_latest=$MAKE_LATEST" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows Release Binary
    needs: resolve-meta
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Quality Verification Gates
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Build Standalone Release Executable
        run: cargo build --release --locked

      - name: Package Windows Binary and ZIP Archive
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-meta.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $exeTarget = "dist\qshare-$tag-windows-x64.exe"
          $zipName = "qshare-$tag-windows-x64.zip"

          Move-Item -Path "target\release\qshare.exe" -Destination $exeTarget -Force
          Write-Output "Created version-numbered binary $exeTarget"

          Compress-Archive -Path $exeTarget -DestinationPath "dist\$zipName" -Force
          Write-Output "Created dist\$zipName"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: dist/*
          retention-days: 1

  build-android:
    name: Build Android Release APK
    needs: resolve-meta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-ffi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Native Rust Engine for Android
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --manifest-path crates/qshare-ffi/Cargo.toml --release

      - name: Generate UniFFI Kotlin Bindings
        run: |
          cargo run --manifest-path crates/qshare-ffi/Cargo.toml --bin uniffi-bindgen \
            generate --library android/app/src/main/jniLibs/arm64-v8a/libqshare_ffi.so \
            --language kotlin \
            --no-format \
            --out-dir android/app/src/main/kotlin/uniffi/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleRelease --no-daemon
          cd ..

      - name: Package Version-Numbered APK
        run: |
          TAG="${{ needs.resolve-meta.outputs.tag }}"
          mkdir -p dist
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_DEST="dist/qshare-${TAG}-android.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "Generated $APK_DEST"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-android
          path: dist/*
          retention-days: 1

  build-macos:
    name: Build macOS & Apple Release Artifacts
    needs: resolve-meta
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-ffi

      - name: Build Universal macOS Desktop Binary (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release/macos
          lipo -create -output target/release/macos/qshare \
            target/aarch64-apple-darwin/release/qshare \
            target/x86_64-apple-darwin/release/qshare
          chmod +x target/release/macos/qshare

      - name: Package macOS Universal Archive
        run: |
          TAG="${{ needs.resolve-meta.outputs.tag }}"
          mkdir -p dist
          ZIP_NAME="qshare-${TAG}-macos-universal.zip"
          cd target/release/macos
          zip -r "../../../dist/${ZIP_NAME}" qshare
          cd ../../..
          echo "Packaged ${ZIP_NAME}"

      - name: Build Native macOS Engine Library (UniFFI)
        run: |
          cargo build --manifest-path crates/qshare-ffi/Cargo.toml --release --target aarch64-apple-darwin
          mkdir -p apple/generated
          cargo run --manifest-path crates/qshare-ffi/Cargo.toml --bin uniffi-bindgen \
            generate --library crates/qshare-ffi/target/aarch64-apple-darwin/release/libqshare_ffi.dylib \
            --language swift \
            --no-format \
            --out-dir apple/generated/

      - name: Package macOS Native Swift Framework Archive
        run: |
          TAG="${{ needs.resolve-meta.outputs.tag }}"
          FRAMEWORK_ZIP="qshare-${TAG}-apple-frameworks.zip"
          mkdir -p apple/build/macos
          cp crates/qshare-ffi/target/aarch64-apple-darwin/release/libqshare_ffi.dylib apple/build/macos/
          cp -r apple/generated apple/build/
          cd apple/build
          zip -r "../../dist/${FRAMEWORK_ZIP}" .
          cd ../..
          echo "Packaged ${FRAMEWORK_ZIP}"

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-apple
          path: dist/*
          retention-days: 1

  publish-release:
    name: Publish Multi-Platform Release
    needs: [resolve-meta, build-windows, build-android, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-artifacts-*
          merge-multiple: true

      - name: Generate Conventional Changelog & Checksums
        id: changelog
        shell: python
        run: |
          import os, subprocess, re

          tag = "${{ needs.resolve-meta.outputs.tag }}"
          
          # 1. Determine commit range
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  text=True, stderr=subprocess.DEVNULL
              ).strip()
              range_spec = f"{prev_tag}..HEAD"
              compare_url = f"https://github.com/${{ github.repository }}/compare/{prev_tag}...{tag}"
          except Exception:
              range_spec = "HEAD"
              compare_url = f"https://github.com/${{ github.repository }}/commits/{tag}"

          try:
              cmd = ["git", "log", range_spec, "--no-merges", "--pretty=format:%s|||%h|||%an"]
              git_output = subprocess.check_output(cmd, text=True, encoding="utf-8")
          except Exception:
              git_output = ""

          categories = {
              "✨ Features": (["feat"], []),
              "🐛 Bug Fixes": (["fix"], []),
              "⚡ Performance Improvements": (["perf"], []),
              "📝 Documentation": (["docs"], []),
              "🔧 Maintenance & Refactoring": (["chore", "refactor", "ci", "build", "test"], []),
              "🔍 Other Changes": ([], [])
          }

          for line in git_output.strip().split("\n"):
              if not line:
                  continue
              parts = line.split("|||")
              if len(parts) < 3:
                  continue
              subj, sha, author = parts[0], parts[1], parts[2]
              matched = False
              for cat, (prefixes, items) in categories.items():
                  for p in prefixes:
                      if re.match(rf"^{p}(\(.*\))?:", subj, re.IGNORECASE):
                          items.append(f"- {subj} (`{sha}`) by @{author}")
                          matched = True
                          break
                  if matched:
                      break
              if not matched:
                  categories["🔍 Other Changes"][1].append(f"- {subj} (`{sha}`) by @{author}")

          # 2. Compute Checksums Table
          dist_dir = "dist"
          files = sorted([f for f in os.listdir(dist_dir) if os.path.isfile(os.path.join(dist_dir, f))])
          
          checksums_lines = []
          checksums_table = "| File | SHA-256 Checksum |\n| :--- | :--- |\n"
          
          import hashlib
          for f in files:
              filepath = os.path.join(dist_dir, f)
              with open(filepath, "rb") as fh:
                  h = hashlib.sha256(fh.read()).hexdigest()
              checksums_lines.append(f"{h}  {f}")
              checksums_table += f"| `{f}` | `{h}` |\n"

          # Write consolidated checksums file
          checksum_filename = f"checksums-{tag}.txt"
          checksum_filepath = os.path.join(dist_dir, checksum_filename)
          with open(checksum_filepath, "w", encoding="utf-8") as fh:
              fh.write("\n".join(checksums_lines) + "\n")

          # 3. Assemble Release Notes
          body = f"## Qshare {tag}\n\n"
          body += "### 📦 Multi-Platform Downloads\n\n"
          body += "- **Windows 10/11 (x64):** Direct executable and compressed ZIP archive\n"
          body += "- **Android (ARM64, ARMv7, x86_64):** Standalone release APK with Jetpack Compose cockpit\n"
          body += "- **macOS (Universal):** Native binary for Apple Silicon (M1/M2/M3/M4) and Intel\n"
          body += "- **iOS & macOS Engine:** Swift & UniFFI Native Frameworks\n\n"

          body += "### 📋 Changelog\n\n"
          has_any_change = False
          for cat, (_, items) in categories.items():
              if items:
                  has_any_change = True
                  body += f"#### {cat}\n"
                  for item in items:
                      body += f"{item}\n"
                  body += "\n"

          if not has_any_change:
              body += "_No specific commits recorded for this release window._\n\n"

          body += f"🔗 **Full Commit Comparison:** [{range_spec}]({compare_url})\n\n"
          body += "### 🔒 Cryptographic Verification\n\n"
          body += checksums_table

          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write(body)

          print("Generated release_notes.md successfully.")

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag }}
          name: ${{ needs.resolve-meta.outputs.title }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.resolve-meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve-meta.outputs.make_latest }}
          files: dist/*

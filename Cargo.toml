[package]
name = "qshare"
version = "0.2.0"
edition = "2024"
authors = ["Jabir Abdullah Haian"]
description = "Zero-cloud hybrid P2P dropzone desktop application in pure Rust"
repository = "https://github.com/Jabir-A-H/Qshare"
publish = false
license = "UNLICENSED"

[lib]
name = "qshare"
path = "src/lib.rs"

[[bin]]
name = "qshare"
path = "src/main.rs"

[dependencies]
# GUI Framework (GPU-accelerated via wgpu / DirectX 12)
iced = { version = "0.13", features = ["tokio", "canvas", "image", "svg"] }

# Multi-threaded Asynchronous Engine
tokio = { version = "1", features = ["full"] }

# P2P Networking, QUIC & UDP Hole-Punching
iroh = "1.3"

# Cryptographic Hashing for Chunk Verification
blake3 = { version = "1.5", features = ["serde"] }

# Data Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Stream Utilities
anyhow = "1.0"
thiserror = "2.0"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Native System & File Dialogs
rfd = "0.15"
dirs = "5.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Network & Protocol Utilities
socket2 = "0.5"
simple-dns = "0.7"
postcard = { version = "1.0", features = ["alloc"] }
data-encoding = "2.6"
url = "2.5"

# Structured Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
